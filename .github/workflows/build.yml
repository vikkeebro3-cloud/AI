name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          ls -l
          z=""
          for f in *.zip; do
            if unzip -tq "$f" >/dev/null 2>&1; then z="$f"; break; fi
          done
          if [ -z "$z" ]; then echo "No valid zip found"; exit 1; fi
          unzip -q "$z" -d work
          d=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          cd "$d"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-APK
          path: out/app-debug.apk
